[package]
name = "scprust-workers"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "scprust-workers"

[dependencies]
scprust-core = { path = "crates/scprust-core", features = ["serde"] }
axum = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["crates/scprust-core", "crates/scprust-server"]
resolver = "2"
